# DB 인덱스 실습 환경
#   make up      → MySQL 실행
#   make seed    → 더미 데이터 생성
# 자세한 사용법은 README.md 참고
name: db-index-lab

services:
  mysql:
    image: mysql:8.4
    container_name: db-index-lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root      # 실습용 비밀번호 (운영에서는 절대 이렇게 하지 마세요)
      MYSQL_DATABASE: lab
      TZ: Asia/Seoul
    ports:
      - "13306:3306"                 # 맥에 다른 MySQL이 3306을 쓰고 있어도 충돌하지 않도록 13306 사용
    volumes:
      - mysql-data:/var/lib/mysql            # DB 데이터 (make destroy 전까지 유지)
      - ./mysql/conf.d:/etc/mysql/conf.d:ro  # 실습용 MySQL 설정
      - ./mysql/init:/docker-entrypoint-initdb.d:ro  # 최초 실행 시 테이블 생성
      - ./:/lab:ro                           # 레포 전체 (SQL 파일 실행용)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 60

  # 측정 도구 (make bench / make explain / make compare 가 사용)
  bench:
    build: ./bench
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lab
      TZ: Asia/Seoul
    volumes:
      - ./:/lab
    working_dir: /lab

volumes:
  mysql-data:
